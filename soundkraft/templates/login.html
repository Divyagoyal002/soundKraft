{% extends "base.html" %}
{% block title %}Dashboard sign-in · SoundKraft{% endblock %}
{% block content %}
<h1>Caregiver &amp; clinician dashboard</h1>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/dashboard/login" class="card form narrow">
  <label>Dashboard PIN
    <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
  </label>
  <button class="btn btn-primary" type="submit">Sign in</button>
</form>
{% endblock %}
